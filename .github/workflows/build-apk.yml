name: Android APK Otomatik Derleme (Capacitor)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Android APK Derle (v1.1)
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: NPM Paketlerini Yukle
        run: npm install --legacy-peer-deps

      - name: TypeScript Kontrolu
        run: npm run lint

      - name: Web Uygulamasini Derle
        run: npm run build

      - name: Capacitor Android Senkronizasyonu
        run: npx cap sync android

      - name: Gradle Calistirma Izni Ver
        run: chmod +x android/gradlew

      - name: Android Debug APK Derle (Gradle)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK Dosyasini Hazirla
        run: |
          mkdir -p build-output
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Otomachine-Engine-Creator-v1.1.apk
          else
            # Alternatif cikis konumu aramasi
            APK_FOUND=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
            cp "$APK_FOUND" build-output/Otomachine-Engine-Creator-v1.1.apk
          fi

      - name: APK Dosyasini Yukle (GitHub Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Otomachine-Engine-Creator-v1.1-APK
          path: build-output/Otomachine-Engine-Creator-v1.1.apk
          retention-days: 14

      - name: GitHub Release'e APK Ekle (Direkt Indirme)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.1
          name: "Otomachine Engine Creator v1.1 APK"
          body: "Otomatik derlenmis Android APK dosyasidir. Android telefonunuza dogrudan indirip kurabilirsiniz."
          files: build-output/Otomachine-Engine-Creator-v1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
