name: Android APK Otomatik Derleme (Capacitor)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Android APK Derle (v1.1)
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Ortamini Kur (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3

      - name: Bagimliliklari Yukle
        run: npm install --legacy-peer-deps

      - name: TypeScript & Kod Kontrolu
        run: npm run lint

      - name: Web Uygulamasini Derle (dist)
        run: npm run build

      - name: Capacitor Android Projesini Olustur
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Zorunlu Yatay (Landscape) Ekran Ayari
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$MANIFEST_FILE"
          fi

      - name: Gradle Calistirma Izni Ver
        run: chmod +x android/gradlew

      - name: Gradle ile Debug APK Derle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Derlenen APK Dosyasini Hazirla
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/Otomachine-Engine-Creator-v1.1-debug.apk
            echo "APK basariyla olusturuldu: $APK_FILE"
          else
            echo "HATA: APK dosyasi bulunamadi!"
            exit 1
          fi

      - name: APK Dosyasini Yukle (GitHub Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Otomachine-Engine-Creator-v1.1-APK
          path: build-output/Otomachine-Engine-Creator-v1.1-debug.apk
          retention-days: 14
