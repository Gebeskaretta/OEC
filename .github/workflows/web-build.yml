name: Web Uygulamasi Otomatik Test & Derleme

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-web:
    name: Web Dagitimi & Test
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Ortamini Kur (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paketleri Yukle
        run: npm install --legacy-peer-deps

      - name: TypeScript Kontrolu
        run: npm run lint

      - name: Web Uygulamasini Derle
        run: npm run build

      - name: Web Ciktisini Yukle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Otomachine-Web-Dist-v1.1
          path: dist/
          retention-days: 7
